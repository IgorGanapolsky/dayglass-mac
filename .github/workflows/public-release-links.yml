name: Public release links

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public release links
        run: python3 scripts/check_public_release_links.py
      - name: Check site claims
        run: python3 scripts/check_site_claims.py
